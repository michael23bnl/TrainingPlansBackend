
services:
  
  plans-elasticsearch:
    container_name: plans-service-elastic
    image: elasticsearch:8.17.0
    ports: 
      - "${ELASTIC_HOST_PORT}:${ELASTIC_CONTAINER_PORT}"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
#      - ELASTIC_PASSWORD=somePassword
    volumes:
      - plans-elastic-data:/usr/share/elasticsearch/data
    networks:
      - plans-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2s
      start_interval: 1s
        
