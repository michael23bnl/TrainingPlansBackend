  plans-postgres:
    container_name: plans-service-postgres
    image: postgres:16
    ports:
      - "${POSTGRES_PLANS_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
      - "${REDIS_PLANS_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_PLANS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PLANS_PASSWORD}
    volumes:
      - plans-postgres-data:/var/lib/postgresql/data
    networks:
      - plans-net
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_PLANS_DB}" ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2s
      start_interval: 1s
      
  sequin:
    container_name: service-sequin
    image: sequin/sequin:latest
    ports:
      - "${SEQUIN_HOST_PORT}:${SEQUIN_CONTAINER_PORT}"
    environment:
      PG_HOSTNAME: plans-postgres
      PG_DATABASE: ${POSTGRES_PLANS_DB}
      PG_PORT: ${POSTGRES_CONTAINER_PORT}
      PG_USERNAME: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PLANS_PASSWORD}
      ELASTICSEARCH_URL: ${ELASTIC_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE} 
      VAULT_KEY: ${VAULT_KEY}
      REDIS_URL: ${REDIS_URL}
      CONFIG_FILE_PATH: /config/playground.yml
    volumes:
      - ./playground.yml:/config/playground.yml
    networks:
      - plans-net
    depends_on:
      plans-postgres:
        condition: service_healthy
      plans-elasticsearch:
        condition: service_healthy
      sequin-redis:
        condition: service_started
        
  sequin-redis:
    image: redis:7
    ports:
      - "${REDIS_SEQUIN_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    command: [ "redis-server", "--port", "${REDIS_CONTAINER_PORT}" ]
    volumes:
      - sequin-redis-data:/data
    networks:
      - plans-net
        
